name = "your-worker-name"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[triggers]
crons = ["* * * * *"]

[site]
bucket = "./client/dist"

[[d1_databases]]
binding = "DB"
database_name = "your-d1-database-name"
database_id = "your-d1-database-id" # wrangler d1 create your-d1-database-name
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "your-r2-bucket-name" # wrangler r2 bucket create your-r2-bucket-name

[vars]
ENVIRONMENT = "production"
